name: living-network

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: living-network-app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: app-runtime
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment: &v2-environment
      NODE_ENV: production
      V2_API_HOST: 0.0.0.0
      V2_API_PORT: 3003
      V2_SQLITE_PATH: /app/data/sqlite/living-network-v2.sqlite
      V2_MEDIA_ROOT: /app/data/media
      REDIS_URL: redis://redis:6379
      V2_QUEUE_PREFIX: living-network-v2
      V2_SCENE_GENERATION_ENABLED: ${V2_SCENE_GENERATION_ENABLED:-false}
      V2_ASSET_GENERATION_ENABLED: ${V2_ASSET_GENERATION_ENABLED:-false}
    command: ["pnpm", "--filter", "@living-network/api", "start:v2"]
    expose:
      - "3003"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media
      - sqlite_data:/app/data/sqlite
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/v2/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    image: living-network-app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: app-runtime
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment: *v2-environment
    command: ["pnpm", "--filter", "@living-network/worker", "start:v2"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media
      - sqlite_data:/app/data/sqlite

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - target: 80
        published: "${WEB_PORT:-4173}"
        host_ip: "${WEB_HOST_BIND:-127.0.0.1}"
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  redis_data:
  sqlite_data:
  media_data:
