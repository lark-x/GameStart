name: living-network

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-living_network}
      POSTGRES_USER: ${POSTGRES_USER:-living_network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-living_network_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-living_network}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-living_network_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  migrate:
    image: living-network-app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: app-runtime
    restart: "no"
    env_file:
      - ../../.env
    environment: &app-environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-living_network}:${POSTGRES_PASSWORD:-living_network_dev_only}@postgres:5432/${POSTGRES_DB:-living_network}
      REDIS_URL: redis://redis:6379
      MEDIA_ROOT: /app/data/media
    command: ["pnpm", "--filter", "@living-network/api", "seed:postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media

  api:
    image: living-network-app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: app-runtime
    restart: unless-stopped
    env_file:
      - ../../.env
    environment: *app-environment
    command: ["pnpm", "--filter", "@living-network/api", "start:postgres"]
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/data/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  worker:
    image: living-network-app:local
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: app-runtime
    restart: unless-stopped
    env_file:
      - ../../.env
    environment: *app-environment
    command: ["pnpm", "--filter", "@living-network/worker", "start:postgres"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_data:
