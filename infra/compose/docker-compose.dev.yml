# Development overrides — adds host port mappings for Redis and API so you can
# connect debugging tools directly from the host machine.
#
# Usage:
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.dev.yml up -d

services:
  redis:
    ports:
      - "6379:6379"

  api:
    ports:
      - "3003:3003"
