# Project-local Sol–Luna routing. Provider, auth, approval, sandbox, MCP,
# hooks, notifications, and network policy intentionally inherit user config.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

[agents.luna_explorer]
description = "Read-only Luna agent for bounded codebase exploration, call-chain tracing, and evidence collection."
config_file = "agents/luna_explorer.toml"

[agents.luna_implementer]
description = "Workspace-write Luna agent for small, reversible, explicitly scoped code changes after Sol has decided the design."
config_file = "agents/luna_implementer.toml"

[agents.luna_tester]
description = "Luna agent for bounded reproduction, tests, builds, and log analysis without changing production behavior."
config_file = "agents/luna_tester.toml"

[agents.sol_escalation]
description = "Read-only Sol High adviser for explicitly qualified architecture, migration, security, concurrency, or data-integrity decisions."
config_file = "agents/sol_escalation.toml"
