name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scope-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Validate AI task scope
        env:
          SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-task-scope.mjs

  v2-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test governance gates
        run: pnpm test:governance
      - name: Check V2 architecture boundaries
        run: pnpm check:boundaries
      - name: Run V2 type checks
        run: pnpm typecheck
      - name: Run V2 unit tests
        run: pnpm test
      - name: Run V2 coverage (100 percent line)
        run: pnpm test:coverage
      - name: Build V2 packages and Web
        run: pnpm build
      - name: Lint V2 Web
        run: pnpm --filter @living-network/web lint

  v2-real-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run V2 SQLite and Redis integration tests
        env:
          RUN_V2_REAL_INTEGRATION: "1"
          REDIS_URL: redis://localhost:6379
        run: pnpm test:integration

  v2-e2e:
    needs: [v2-verify, v2-real-services]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run V2 Playwright paths
        env:
          REDIS_URL: redis://localhost:6379
        run: pnpm test:e2e
