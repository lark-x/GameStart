name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run strict type checks
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Run coverage (100 % line)
        run: pnpm test:coverage
      - name: Build all packages
        run: pnpm build
      - name: Lint web app
        run: pnpm --filter @living-network/web lint

  real-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: living_network
          POSTGRES_PASSWORD: living_network_ci
          POSTGRES_DB: living_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U living_network"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real service integration tests
        env:
          RUN_REAL_INTEGRATION: "1"
          DATABASE_URL: postgresql://living_network:living_network_ci@localhost:5432/living_network
          REDIS_URL: redis://localhost:6379
        run: pnpm test:integration

  e2e:
    needs: [verify, real-services]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: living_network
          POSTGRES_PASSWORD: living_network_ci
          POSTGRES_DB: living_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U living_network"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build all packages
        run: pnpm build
      - name: Run Playwright E2E tests
        env:
          DATABASE_URL: postgresql://living_network:living_network_ci@localhost:5432/living_network
          REDIS_URL: redis://localhost:6379
        run: pnpm test:e2e
